client_id = "48ee7db5ed57a704126e82815fe5928d"
name = "Upsellity-AI-Dev"
application_url = "https://clearly-myself-displaying-close.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_product_listings,read_products,write_checkouts,write_products"

[auth]
redirect_urls = [
  "https://clearly-myself-displaying-close.trycloudflare.com/auth/callback",
  "https://clearly-myself-displaying-close.trycloudflare.com/auth/shopify/callback",
  "https://clearly-myself-displaying-close.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
