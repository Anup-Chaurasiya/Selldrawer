name = "Upsellity-AI-Dev"
application_url = "https://cad-craft-facial-opportunity.trycloudflare.com"
embedded = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/privacy"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "shop/update" ]
  uri = "/webhooks/shop/update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_discounts,write_discounts,read_product_listings,read_products,write_checkouts,write_products,read_themes"

[auth]
redirect_urls = [
  "https://clearly-myself-displaying-close.trycloudflare.com/auth/callback",
  "https://clearly-myself-displaying-close.trycloudflare.com/auth/shopify/callback",
  "https://clearly-myself-displaying-close.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true