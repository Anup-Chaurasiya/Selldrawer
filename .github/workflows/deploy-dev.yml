name: Deploy to DEV Environment

on:
  push:
    branches: [ main ] # Triggers automatically when code is pushed/merged to main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: selldrawer-dev/app
  ECS_SERVICE: selldrawer-dev-app-service
  ECS_CLUSTER: selldrawer-dev
  ECS_TASK_DEFINITION: selldrawer-dev-app
  CONTAINER_NAME: app

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    # --- AWS BACKEND DEPLOYMENT ---
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Download task definition
      run: |
        aws ecs describe-task-definition --task-definition $ECS_TASK_DEFINITION --query taskDefinition > task-definition.json
        jq 'del(.enableFaultInjection, .faultInjectionRules)' task-definition.json > task-definition-clean.json
        mv task-definition-clean.json task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}
        environment-variables: |
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}
          SHOPIFY_API_KEY=${{ secrets.SHOPIFY_API_KEY_DEV }}
          SHOPIFY_API_SECRET=${{ secrets.SHOPIFY_API_SECRET_DEV }}
          SHOPIFY_APP_URL=https://dev.app.selldrawer.com
          SCOPES=write_products,read_products,read_product_listings,write_checkouts,read_checkouts,read_discounts

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    # --- SHOPIFY EXTENSIONS DEPLOYMENT ---
    - name: Deploy Shopify App Extensions to DEV
      env:
        SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY_DEV }}
        SHOPIFY_CLI_TTY: 0 
      run: |
        echo "Deploying extensions and app config to Dev App..."
        npm run shopify app deploy -- --force --client-id="${{ secrets.SHOPIFY_API_KEY_DEV }}"
