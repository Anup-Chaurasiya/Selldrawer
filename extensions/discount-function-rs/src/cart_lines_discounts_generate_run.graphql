query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
      # FBT Bundle attributes
      fbtBundleId: attribute(key: "_fbt_bundle_id") {
        value
      }
      fbtDiscountType: attribute(key: "_fbt_discount_type") {
        value
      }
      fbtDiscountValue: attribute(key: "_fbt_discount_value") {
        value
      }
      fbtBundleSize: attribute(key: "_fbt_bundle_size") {
        value
      }
      # Milestone/Free Gift attributes
      selldrawerGiftSource: attribute(key: "_selldrawer_gift_source") {
        value
      }
      selldrawerDiscountType: attribute(key: "_selldrawer_discount_type") {
        value
      }
      selldrawerDiscountValue: attribute(key: "_selldrawer_discount_value") {
        value
      }
      cost {
        subtotalAmount {
          amount
        }
      }
    }
  }
}

