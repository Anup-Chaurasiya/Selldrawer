# Learn more about run.graphql at https://shopify.dev/docs/apps/build/functions/input-output

query Input {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
      attribute(key: "_fbt_bundle_id") {
        value
      }
      fbtRuleId: attribute(key: "_fbt_rule_id") {
        value
      }
      fbtDiscountType: attribute(key: "_fbt_discount_type") {
        value
      }
      fbtDiscountValue: attribute(key: "_fbt_discount_value") {
        value
      }
      fbtProductCount: attribute(key: "_fbt_product_count") {
        value
      }
    }
  }
}
