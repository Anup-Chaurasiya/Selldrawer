[package]
name = "fbt-discount"
version = "1.0.0"
edition = "2021"

[dependencies]
shopify_function = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "fbt-discount"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 'z'
strip = true
